[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tifa-lockhart-bot"
version = "1.0.0"
description = "A responsible Tifa Lockhart media discovery and archive bot."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "discord.py>=2.4,<3",
  "aiohttp>=3.10,<4",
  "python-dotenv>=1.0,<2",
  "supabase>=2.10,<3",
  "boto3>=1.35,<2",
  "praw>=7.7,<8",
  "tzdata>=2024.1",
  "Pillow>=10,<12",
  "ImageHash>=4.3,<5",
  "yt-dlp>=2024.1,<2027",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.2,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
