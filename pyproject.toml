[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tifa-lockhart-bot"
version = "0.1.0"
description = "A responsible Tifa Lockhart media discovery and archive bot."
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.4,<3",
  "aiohttp>=3.10,<4",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.7,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
